aid: amber-group
name: Amber Group
description: 'Amber Group is a global digital asset financial services firm founded in 2017 by former
  traditional-finance traders, providing trading, liquidity provision, wealth and asset management,
  staking, and treasury solutions for institutions and high-net-worth clients. Its institutional
  platform, Amber Premium (Nasdaq: AMBR), operates from financial hubs including Singapore, Hong Kong,
  and Dubai, and publishes the Amber Premium Global API service suite so clients can integrate trading,
  liquidity, and account services into their own systems. This profile was surfaced as a portfolio
  company of DCM Ventures, Pantera Capital, and Paradigm and enriched with the company''s public
  developer, legal, and support surfaces.'
